services:
  app:
    build:
      context: .
      target: runner
    container_name: bun_express_app
    restart: always
    ports:
      - "${PORT}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${PORT}
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Local binary avoids bun x lookup failures; run migrations before boot.
    command: sh -c "./node_modules/.bin/prisma migrate deploy && bun run index.ts"
